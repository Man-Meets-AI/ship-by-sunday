name: PR Checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_BASE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_dummy
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      CLERK_SECRET_KEY: sk_test_ci_dummy
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_ci_dummy
      NEXT_PUBLIC_CONVEX_URL: https://smoke-test.convex.cloud
      NEXT_PUBLIC_CONVEX_SITE_URL: https://smoke-test.convex.site
      OBSERVABILITY_INGEST_TOKEN: observability_ci_dummy
      OBSERVABILITY_INCIDENT_CONTROL_TOKEN: incident_ci_dummy
      OBSERVABILITY_VERCEL_WEBHOOK_SECRET: vercel_ci_dummy
      CLERK_FRONTEND_API_URL: https://clerk.example.com
      CLERK_AUTHORIZED_PARTIES: http://127.0.0.1:3100,http://localhost:3100
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format

      - name: Verify formatting is clean
        run: git diff --exit-code

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Contract tests
        run: bun run test:contracts

      - name: Build
        run: bun run build

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_BASE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_dummy
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      CLERK_SECRET_KEY: sk_test_ci_dummy
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_ci_dummy
      NEXT_PUBLIC_CONVEX_URL: https://smoke-test.convex.cloud
      NEXT_PUBLIC_CONVEX_SITE_URL: https://smoke-test.convex.site
      OBSERVABILITY_INGEST_TOKEN: observability_ci_dummy
      OBSERVABILITY_INCIDENT_CONTROL_TOKEN: incident_ci_dummy
      OBSERVABILITY_VERCEL_WEBHOOK_SECRET: vercel_ci_dummy
      CLERK_FRONTEND_API_URL: https://clerk.example.com
      CLERK_AUTHORIZED_PARTIES: http://127.0.0.1:3100,http://localhost:3100
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bun run --cwd apps/web playwright:install

      - name: Build application
        run: bun run build

      - name: Browser E2E
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
