name: Tag Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      git_tag:
        description: Release tag to validate, for example v0.3.0
        required: false
        type: string
      tag_target_sha:
        description: Explicit tag target SHA for a dry-run or repair validation
        required: false
        type: string
      dry_run:
        description: Validate and upload evidence without publishing a GitHub Release
        required: true
        type: boolean
        default: true

permissions:
  actions: read
  contents: read
  checks: read

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_release_identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dry_run: ${{ steps.release_identity.outputs.dry_run }}
      git_tag: ${{ steps.release_identity.outputs.git_tag }}
      main_sha: ${{ steps.release_identity.outputs.main_sha }}
      tag_target_sha: ${{ steps.release_identity.outputs.tag_target_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.12.0

      - name: Resolve release identity
        id: release_identity
        env:
          INPUT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          INPUT_GIT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.git_tag || '' }}
          INPUT_TAG_TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_target_sha || '' }}
        run: |
          git fetch --tags origin main

          if [[ "${{ github.event_name }}" == "push" ]]; then
            git_tag="${GITHUB_REF_NAME}"
            tag_target_sha="$(git rev-list -n 1 "$git_tag")"
            dry_run="false"
          else
            git_tag="${INPUT_GIT_TAG:-$(node -e 'console.log(require("./release.json").gitTag)')}"
            if [[ -n "$INPUT_TAG_TARGET_SHA" ]]; then
              tag_target_sha="$INPUT_TAG_TARGET_SHA"
            elif git rev-parse "$git_tag^{commit}" >/dev/null 2>&1; then
              tag_target_sha="$(git rev-parse "$git_tag^{commit}")"
            elif [[ "$INPUT_DRY_RUN" == "true" ]]; then
              tag_target_sha="$(git rev-parse origin/main)"
            else
              echo "Tag $git_tag does not exist and this is not a dry-run." >&2
              exit 1
            fi
            dry_run="$INPUT_DRY_RUN"
          fi

          main_sha="$(git rev-parse origin/main)"

          if [[ "$dry_run" != "true" ]]; then
            if ! existing_tag_sha="$(git rev-parse "refs/tags/$git_tag^{commit}" 2>/dev/null)"; then
              echo "Release publication requires an existing protected tag ref: refs/tags/$git_tag" >&2
              exit 1
            fi

            if [[ "$existing_tag_sha" != "$tag_target_sha" ]]; then
              echo "Release tag $git_tag resolves to $existing_tag_sha, not requested target $tag_target_sha." >&2
              exit 1
            fi
          fi

          echo "git_tag=$git_tag" >> "$GITHUB_OUTPUT"
          echo "tag_target_sha=$tag_target_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

      - name: Validate release manifest
        env:
          GIT_TAG: ${{ steps.release_identity.outputs.git_tag }}
          MAIN_SHA: ${{ steps.release_identity.outputs.main_sha }}
          TAG_TARGET_SHA: ${{ steps.release_identity.outputs.tag_target_sha }}
        run: |
          node scripts/release/validate-release-manifest.mjs \
            --manifest=release.json \
            --changelog=CHANGELOG.md \
            --tag="$GIT_TAG" \
            --main-sha="$MAIN_SHA" \
            --tag-target-sha="$TAG_TARGET_SHA"

  build_release_evidence:
    needs:
      - validate_release_identity
      - collect_hosted_proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.12.0

      - name: Build release evidence
        env:
          AUTH_STATUS: ${{ needs.collect_hosted_proof.outputs.auth_status }}
          AUTH_RUN_ID: ${{ needs.collect_hosted_proof.outputs.auth_run_id }}
          AUTH_URL: ${{ needs.collect_hosted_proof.outputs.auth_url }}
          AUTH_NOTES: ${{ needs.collect_hosted_proof.outputs.auth_notes }}
          BILLING_STATUS: ${{ needs.collect_hosted_proof.outputs.billing_status }}
          BILLING_RUN_ID: ${{ needs.collect_hosted_proof.outputs.billing_run_id }}
          BILLING_URL: ${{ needs.collect_hosted_proof.outputs.billing_url }}
          BILLING_NOTES: ${{ needs.collect_hosted_proof.outputs.billing_notes }}
          CONVEX_STATUS: ${{ needs.collect_hosted_proof.outputs.convex_status }}
          CONVEX_RUN_ID: ${{ needs.collect_hosted_proof.outputs.convex_run_id }}
          CONVEX_URL: ${{ needs.collect_hosted_proof.outputs.convex_url }}
          CONVEX_NOTES: ${{ needs.collect_hosted_proof.outputs.convex_notes }}
          ENTITLEMENT_STATUS: ${{ needs.collect_hosted_proof.outputs.entitlement_status }}
          ENTITLEMENT_RUN_ID: ${{ needs.collect_hosted_proof.outputs.entitlement_run_id }}
          ENTITLEMENT_URL: ${{ needs.collect_hosted_proof.outputs.entitlement_url }}
          ENTITLEMENT_NOTES: ${{ needs.collect_hosted_proof.outputs.entitlement_notes }}
          GIT_TAG: ${{ needs.validate_release_identity.outputs.git_tag }}
          MAIN_SHA: ${{ needs.validate_release_identity.outputs.main_sha }}
          TAG_TARGET_SHA: ${{ needs.validate_release_identity.outputs.tag_target_sha }}
          VERCEL_STATUS: ${{ needs.collect_hosted_proof.outputs.vercel_status }}
          VERCEL_RUN_ID: ${{ needs.collect_hosted_proof.outputs.vercel_run_id }}
          VERCEL_URL: ${{ needs.collect_hosted_proof.outputs.vercel_url }}
          VERCEL_NOTES: ${{ needs.collect_hosted_proof.outputs.vercel_notes }}
        run: |
          node scripts/release/build-release-evidence.mjs \
            --manifest=release.json \
            --output=release-evidence.v1.json \
            --tag="$GIT_TAG" \
            --tag-target-sha="$TAG_TARGET_SHA" \
            --main-sha="$MAIN_SHA" \
            --vercel-status="$VERCEL_STATUS" \
            --vercel-run-id="$VERCEL_RUN_ID" \
            --vercel-url="$VERCEL_URL" \
            --vercel-notes="$VERCEL_NOTES" \
            --convex-status="$CONVEX_STATUS" \
            --convex-run-id="$CONVEX_RUN_ID" \
            --convex-url="$CONVEX_URL" \
            --convex-notes="$CONVEX_NOTES" \
            --billing-status="$BILLING_STATUS" \
            --billing-run-id="$BILLING_RUN_ID" \
            --billing-url="$BILLING_URL" \
            --billing-notes="$BILLING_NOTES" \
            --auth-status="$AUTH_STATUS" \
            --auth-run-id="$AUTH_RUN_ID" \
            --auth-url="$AUTH_URL" \
            --auth-notes="$AUTH_NOTES" \
            --entitlement-status="$ENTITLEMENT_STATUS" \
            --entitlement-run-id="$ENTITLEMENT_RUN_ID" \
            --entitlement-url="$ENTITLEMENT_URL" \
            --entitlement-notes="$ENTITLEMENT_NOTES" \
            --dry-run

      - name: Build release notes
        run: |
          node scripts/release/build-release-notes.mjs \
            --manifest=release.json \
            --changelog=CHANGELOG.md \
            --evidence=release-evidence.v1.json \
            --output=release-notes.md

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-evidence-v1
          path: |
            release-evidence.v1.json
            release-notes.md

  publish_release:
    if: needs.validate_release_identity.outputs.dry_run != 'true'
    needs:
      - validate_release_identity
      - collect_hosted_proof
      - build_release_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release-publication
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.12.0

      - name: Fail closed until hosted proof is supplied
        env:
          AUTH_STATUS: ${{ needs.collect_hosted_proof.outputs.auth_status }}
          AUTH_RUN_ID: ${{ needs.collect_hosted_proof.outputs.auth_run_id }}
          AUTH_URL: ${{ needs.collect_hosted_proof.outputs.auth_url }}
          AUTH_NOTES: ${{ needs.collect_hosted_proof.outputs.auth_notes }}
          BILLING_STATUS: ${{ needs.collect_hosted_proof.outputs.billing_status }}
          BILLING_RUN_ID: ${{ needs.collect_hosted_proof.outputs.billing_run_id }}
          BILLING_URL: ${{ needs.collect_hosted_proof.outputs.billing_url }}
          BILLING_NOTES: ${{ needs.collect_hosted_proof.outputs.billing_notes }}
          CONVEX_STATUS: ${{ needs.collect_hosted_proof.outputs.convex_status }}
          CONVEX_RUN_ID: ${{ needs.collect_hosted_proof.outputs.convex_run_id }}
          CONVEX_URL: ${{ needs.collect_hosted_proof.outputs.convex_url }}
          CONVEX_NOTES: ${{ needs.collect_hosted_proof.outputs.convex_notes }}
          ENTITLEMENT_STATUS: ${{ needs.collect_hosted_proof.outputs.entitlement_status }}
          ENTITLEMENT_RUN_ID: ${{ needs.collect_hosted_proof.outputs.entitlement_run_id }}
          ENTITLEMENT_URL: ${{ needs.collect_hosted_proof.outputs.entitlement_url }}
          ENTITLEMENT_NOTES: ${{ needs.collect_hosted_proof.outputs.entitlement_notes }}
          GIT_TAG: ${{ needs.validate_release_identity.outputs.git_tag }}
          MAIN_SHA: ${{ needs.validate_release_identity.outputs.main_sha }}
          TAG_TARGET_SHA: ${{ needs.validate_release_identity.outputs.tag_target_sha }}
          VERCEL_STATUS: ${{ needs.collect_hosted_proof.outputs.vercel_status }}
          VERCEL_RUN_ID: ${{ needs.collect_hosted_proof.outputs.vercel_run_id }}
          VERCEL_URL: ${{ needs.collect_hosted_proof.outputs.vercel_url }}
          VERCEL_NOTES: ${{ needs.collect_hosted_proof.outputs.vercel_notes }}
        run: |
          node scripts/release/build-release-evidence.mjs \
            --manifest=release.json \
            --output=release-evidence.publish-check.json \
            --tag="$GIT_TAG" \
            --tag-target-sha="$TAG_TARGET_SHA" \
            --main-sha="$MAIN_SHA" \
            --vercel-status="$VERCEL_STATUS" \
            --vercel-run-id="$VERCEL_RUN_ID" \
            --vercel-url="$VERCEL_URL" \
            --vercel-notes="$VERCEL_NOTES" \
            --convex-status="$CONVEX_STATUS" \
            --convex-run-id="$CONVEX_RUN_ID" \
            --convex-url="$CONVEX_URL" \
            --convex-notes="$CONVEX_NOTES" \
            --billing-status="$BILLING_STATUS" \
            --billing-run-id="$BILLING_RUN_ID" \
            --billing-url="$BILLING_URL" \
            --billing-notes="$BILLING_NOTES" \
            --auth-status="$AUTH_STATUS" \
            --auth-run-id="$AUTH_RUN_ID" \
            --auth-url="$AUTH_URL" \
            --auth-notes="$AUTH_NOTES" \
            --entitlement-status="$ENTITLEMENT_STATUS" \
            --entitlement-run-id="$ENTITLEMENT_RUN_ID" \
            --entitlement-url="$ENTITLEMENT_URL" \
            --entitlement-notes="$ENTITLEMENT_NOTES" \
            --validate-publish

      - name: Build release notes
        run: |
          node scripts/release/build-release-notes.mjs \
            --manifest=release.json \
            --changelog=CHANGELOG.md \
            --evidence=release-evidence.publish-check.json \
            --output=release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TAG: ${{ needs.validate_release_identity.outputs.git_tag }}
          TAG_TARGET_SHA: ${{ needs.validate_release_identity.outputs.tag_target_sha }}
        run: |
          gh release create "$GIT_TAG" \
            --target "$TAG_TARGET_SHA" \
            --title "$GIT_TAG" \
            --notes-file release-notes.md

          gh release upload "$GIT_TAG" release-evidence.publish-check.json --clobber

  collect_hosted_proof:
    needs: validate_release_identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      auth_status: ${{ steps.proof.outputs.auth_status }}
      auth_run_id: ${{ steps.proof.outputs.auth_run_id }}
      auth_url: ${{ steps.proof.outputs.auth_url }}
      auth_notes: ${{ steps.proof.outputs.auth_notes }}
      billing_status: ${{ steps.proof.outputs.billing_status }}
      billing_run_id: ${{ steps.proof.outputs.billing_run_id }}
      billing_url: ${{ steps.proof.outputs.billing_url }}
      billing_notes: ${{ steps.proof.outputs.billing_notes }}
      convex_status: ${{ steps.proof.outputs.convex_status }}
      convex_run_id: ${{ steps.proof.outputs.convex_run_id }}
      convex_url: ${{ steps.proof.outputs.convex_url }}
      convex_notes: ${{ steps.proof.outputs.convex_notes }}
      entitlement_status: ${{ steps.proof.outputs.entitlement_status }}
      entitlement_run_id: ${{ steps.proof.outputs.entitlement_run_id }}
      entitlement_url: ${{ steps.proof.outputs.entitlement_url }}
      entitlement_notes: ${{ steps.proof.outputs.entitlement_notes }}
      vercel_status: ${{ steps.proof.outputs.vercel_status }}
      vercel_run_id: ${{ steps.proof.outputs.vercel_run_id }}
      vercel_url: ${{ steps.proof.outputs.vercel_url }}
      vercel_notes: ${{ steps.proof.outputs.vercel_notes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.12.0

      - name: Collect proof summaries for tag target
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_TARGET_SHA: ${{ needs.validate_release_identity.outputs.tag_target_sha }}
        run: |
          node scripts/release/collect-hosted-proof-summaries.mjs \
            --commit="$TAG_TARGET_SHA"
