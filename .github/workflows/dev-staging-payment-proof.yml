name: Dev Staging Payment Proof

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-staging-payment-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stripe_card_payment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_BASE_URL: https://dev.man-meets-ai.com
      PLAYWRIGHT_BASE_URL: https://dev.man-meets-ai.com
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require dev ref
        if: github.ref_name != 'dev'
        run: |
          echo "Dev staging payment proof must run from the dev branch. Re-run this workflow with --ref dev." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bun run --cwd apps/web playwright:install

      - name: Wait for matching Vercel dev preview deployment
        run: |
          node scripts/release/wait-for-vercel-production-deployment.mjs \
            --commit_sha="${{ github.sha }}" \
            --target=preview \
            --alias_domain=dev.man-meets-ai.com \
            --timeout_ms=900000

      - name: Pull preview app env from Vercel
        run: |
          cd apps/web
          bunx vercel env pull .env.local --environment preview --git-branch=dev --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_ID"
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");

          const envPath = ".env.local";
          const filtered = readFileSync(envPath, "utf8")
            .split("\n")
            .filter(
              (line) =>
                !line.startsWith("VERCEL") &&
                !line.startsWith("TURBO_") &&
                !line.startsWith("NX_DAEMON="),
            );

          writeFileSync(envPath, `${filtered.join("\n")}\n`);
          NODE

      - name: Run dev Stripe card payment proof
        run: |
          bun run --cwd apps/web stripe:hosted:verify:dev-card -- \
            --base-url="$PLAYWRIGHT_BASE_URL"

      - name: Upload payment proof artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dev-staging-payment-proof-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
