name: Production Release Proof

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit SHA for manual release-scope detection
        required: true
        type: string
      force_billing:
        description: Force the billing integration gate for a manual rerun
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: production-release-proof-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release_scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.refs.outputs.base_sha }}
      billing_sensitive: ${{ steps.scope.outputs.billing_sensitive }}
      convex_sensitive: ${{ steps.scope.outputs.convex_sensitive }}
      head_sha: ${{ steps.refs.outputs.head_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0

      - name: Resolve release scope refs
        id: refs
        env:
          MANUAL_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
              echo "Manual production release proof must run from refs/heads/main." >&2
              exit 1
            fi

            head_sha="$(git rev-parse HEAD)"
            base_sha="$(printf '%s' "$MANUAL_BASE_SHA" | tr -d '[:space:]')"

            if [[ -z "$base_sha" ]]; then
              echo "Manual production release proof requires inputs.base_sha so billing and Convex release-scope detection covers the intended commit range." >&2
              exit 1
            fi

            if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              echo "Manual production release proof base_sha is not a commit in this checkout: $base_sha" >&2
              exit 1
            fi

            base_sha="$(git rev-parse "$base_sha")"
            if [[ "$base_sha" == "$head_sha" ]]; then
              echo "Manual production release proof base_sha must be an ancestor before HEAD, not HEAD itself." >&2
              exit 1
            fi

            if ! git merge-base --is-ancestor "$base_sha" "$head_sha"; then
              echo "Manual production release proof base_sha must be an ancestor of HEAD." >&2
              exit 1
            fi
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Detect release scope
        id: scope
        env:
          FORCE_BILLING: ${{ github.event_name == 'workflow_dispatch' && inputs.force_billing }}
          RELEASE_BASE_SHA: ${{ steps.refs.outputs.base_sha }}
          RELEASE_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        run: |
          node scripts/release/detect-release-scope.mjs --base="$RELEASE_BASE_SHA" --head="$RELEASE_HEAD_SHA"

          if [[ "$FORCE_BILLING" == "true" ]]; then
            echo "billing_sensitive=true" >> "$GITHUB_OUTPUT"
          fi

  default_ship:
    needs: release_scope
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: production-release-proof
    env:
      APP_BASE_URL: https://www.man-meets-ai.com
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      PLAYWRIGHT_BASE_URL: https://www.man-meets-ai.com
      PRODUCTION_CONVEX_CONFIG_JSON: ${{ secrets.PRODUCTION_CONVEX_CONFIG_JSON }}
      QA_ENV_FILE: apps/web/.env.production
      RELEASE_PERSONAS_LOCAL_FILE: tmp/release-personas.local.json
      RELEASE_PERSONAS_LOCAL_JSON: ${{ secrets.PRODUCTION_QA_PERSONAS_LOCAL_JSON }}
      RELEASE_COMMIT_SHA: ${{ needs.release_scope.outputs.head_sha }}
      CONVEX_PRODUCTION_DEPLOY_ENABLED: ${{ vars.CONVEX_PRODUCTION_DEPLOY_ENABLED }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bun run --cwd apps/web playwright:install

      - name: Wait for matching Convex production deploy
        if: needs.release_scope.outputs.convex_sensitive == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$CONVEX_PRODUCTION_DEPLOY_ENABLED" != "true" ]]; then
            echo "Convex-sensitive production proof requires CONVEX_PRODUCTION_DEPLOY_ENABLED=true so the same main commit deploys to Convex production." >&2
            exit 1
          fi

          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            run_json="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow convex-production-deploy.yml \
              --event push \
              --branch main \
              --commit "$RELEASE_COMMIT_SHA" \
              --json databaseId,status,conclusion,url,headSha \
              --limit 10)"

            decision="$(RUN_JSON="$run_json" node - <<'NODE'
          const runs = JSON.parse(process.env.RUN_JSON || "[]")
            .filter((run) => run.headSha === process.env.RELEASE_COMMIT_SHA)
            .sort((left, right) => Number(right.databaseId ?? 0) - Number(left.databaseId ?? 0));

          const latest = runs[0];
          if (!latest) {
            console.log("pending no matching Convex Production Deploy run yet");
          } else if (latest.status !== "completed") {
            console.log(`pending ${latest.status} ${latest.url}`);
          } else if (latest.conclusion === "success") {
            console.log(`success ${latest.databaseId} ${latest.url}`);
          } else {
            console.log(`failed ${latest.conclusion || "unknown"} ${latest.url}`);
          }
          NODE
          )"

            case "$decision" in
              success*)
                read -r _ convex_run_id convex_run_url <<< "$decision"
                convex_summary_dir="$(mktemp -d)"
                gh run download "$convex_run_id" \
                  --repo "$GITHUB_REPOSITORY" \
                  --name convex-production-deploy-summary \
                  --dir "$convex_summary_dir"
                node scripts/release/verify-convex-production-deploy-summary.mjs \
                  --summary="$convex_summary_dir/convex-production-deploy-summary.json" \
                  --commit="$RELEASE_COMMIT_SHA"
                echo "Matching Convex production deploy passed: $convex_run_url"
                exit 0
                ;;
              failed*)
                echo "Matching Convex production deploy did not pass: ${decision#failed }" >&2
                exit 1
                ;;
              *)
                echo "Waiting for matching Convex production deploy: $decision"
                sleep 20
                ;;
            esac
          done

          echo "Timed out waiting for Convex Production Deploy for commit $RELEASE_COMMIT_SHA." >&2
          exit 1

      - name: Wait for matching Vercel production deployment
        run: |
          node scripts/release/wait-for-vercel-production-deployment.mjs \
            --commit_sha="$RELEASE_COMMIT_SHA" \
            --alias_domain=www.man-meets-ai.com

      - name: Wait for public release
        run: node scripts/release/wait-for-host.mjs --url="$PLAYWRIGHT_BASE_URL" --path=/ --path=/checkout/success

      - name: Write release persona credentials
        run: |
          if [[ -z "$RELEASE_PERSONAS_LOCAL_JSON" ]]; then
            echo "PRODUCTION_QA_PERSONAS_LOCAL_JSON is not configured." >&2
            exit 1
          fi
          mkdir -p tmp
          printf '%s\n' "$RELEASE_PERSONAS_LOCAL_JSON" > "$RELEASE_PERSONAS_LOCAL_FILE"

      - name: Pull production app env from Vercel production
        run: |
          cd apps/web
          bunx vercel env pull .env.production --environment production --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_ID"
          python - <<'PY'
          from pathlib import Path

          env_path = Path(".env.production")
          lines = env_path.read_text().splitlines()
          filtered = [
              line
              for line in lines
              if not (
                  line.startswith("VERCEL")
                  or line.startswith("TURBO_")
                  or line.startswith("NX_DAEMON=")
              )
          ]
          env_path.write_text("\n".join(filtered) + "\n")
          PY

      - name: Write Convex CLI auth config
        run: |
          if [[ -z "$PRODUCTION_CONVEX_CONFIG_JSON" ]]; then
            echo "PRODUCTION_CONVEX_CONFIG_JSON is not configured." >&2
            exit 1
          fi
          mkdir -p "$HOME/.convex"
          printf '%s\n' "$PRODUCTION_CONVEX_CONFIG_JSON" > "$HOME/.convex/config.json"

      - name: Run production default ship proof
        run: bun run release:proof -- --proof=default_ship

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-default-ship-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  billing_integration:
    if: needs.release_scope.outputs.billing_sensitive == 'true'
    needs:
      - release_scope
      - default_ship
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production-billing-integration
    env:
      APP_BASE_URL: https://www.man-meets-ai.com
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      PLAYWRIGHT_BASE_URL: https://www.man-meets-ai.com
      PRODUCTION_CONVEX_CONFIG_JSON: ${{ secrets.PRODUCTION_CONVEX_CONFIG_JSON }}
      PRODUCTION_STRIPE_SECRET_KEY: ${{ secrets.PRODUCTION_STRIPE_SECRET_KEY }}
      PRODUCTION_STRIPE_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_STRIPE_WEBHOOK_SECRET }}
      QA_ALLOW_BILLING_INTEGRATION: "1"
      QA_ENV_FILE: apps/web/.env.production
      QA_REQUIRE_CONVEX_DEBUG: "1"
      RELEASE_PERSONAS_LOCAL_FILE: tmp/release-personas.local.json
      RELEASE_PERSONAS_LOCAL_JSON: ${{ secrets.PRODUCTION_QA_PERSONAS_LOCAL_JSON }}
      RELEASE_COMMIT_SHA: ${{ needs.release_scope.outputs.head_sha }}
      STRIPE_SECRET_KEY: ${{ secrets.PRODUCTION_STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_STRIPE_WEBHOOK_SECRET }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bun run --cwd apps/web playwright:install

      - name: Wait for matching Vercel production deployment
        run: |
          node scripts/release/wait-for-vercel-production-deployment.mjs \
            --commit_sha="$RELEASE_COMMIT_SHA" \
            --alias_domain=www.man-meets-ai.com

      - name: Wait for public release
        run: node scripts/release/wait-for-host.mjs --url="$PLAYWRIGHT_BASE_URL" --path=/ --path=/checkout/success

      - name: Write release persona credentials
        run: |
          if [[ -z "$RELEASE_PERSONAS_LOCAL_JSON" ]]; then
            echo "PRODUCTION_QA_PERSONAS_LOCAL_JSON is not configured." >&2
            exit 1
          fi
          mkdir -p tmp
          printf '%s\n' "$RELEASE_PERSONAS_LOCAL_JSON" > "$RELEASE_PERSONAS_LOCAL_FILE"

      - name: Pull production app env from Vercel production
        run: |
          cd apps/web
          bunx vercel env pull .env.production --environment production --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_ID"
          python - <<'PY'
          from pathlib import Path

          env_path = Path(".env.production")
          lines = env_path.read_text().splitlines()
          filtered = [
              line
              for line in lines
              if not (
                  line.startswith("VERCEL")
                  or line.startswith("TURBO_")
                  or line.startswith("NX_DAEMON=")
              )
          ]
          env_path.write_text("\n".join(filtered) + "\n")
          PY

      - name: Write Convex CLI auth config
        run: |
          if [[ -z "$PRODUCTION_CONVEX_CONFIG_JSON" ]]; then
            echo "PRODUCTION_CONVEX_CONFIG_JSON is not configured." >&2
            exit 1
          fi
          mkdir -p "$HOME/.convex"
          printf '%s\n' "$PRODUCTION_CONVEX_CONFIG_JSON" > "$HOME/.convex/config.json"

      - name: Verify production Stripe environment and checkout route
        run: |
          cd apps/web
          bun --env-file=.env.production scripts/verify-managed-stripe-env.ts \
            --expected-mode=live \
            --app-base-url=https://www.man-meets-ai.com \
            --require-webhook-endpoint

      - name: Run production billing integration proof
        run: bun run release:proof -- --proof=billing_integration

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-billing-integration-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  release_gate:
    if: always()
    needs:
      - release_scope
      - default_ship
      - billing_integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Summarize production release proof
        env:
          BILLING_SENSITIVE: ${{ needs.release_scope.outputs.billing_sensitive }}
          BILLING_RESULT: ${{ needs.billing_integration.result }}
          CONVEX_SENSITIVE: ${{ needs.release_scope.outputs.convex_sensitive }}
          DEFAULT_SHIP_RESULT: ${{ needs.default_ship.result }}
        run: |
          if [[ "$DEFAULT_SHIP_RESULT" != "success" ]]; then
            echo "default_ship failed in production release proof." >&2
            exit 1
          fi

          if [[ "$BILLING_SENSITIVE" == "true" && "$BILLING_RESULT" != "success" ]]; then
            echo "billing_integration was required and did not succeed in production release proof." >&2
            exit 1
          fi

          echo "Production release proof passed."

      - name: Write production release proof summary
        if: always()
        env:
          BILLING_RESULT: ${{ needs.billing_integration.result }}
          BILLING_SENSITIVE: ${{ needs.release_scope.outputs.billing_sensitive }}
          CONVEX_SENSITIVE: ${{ needs.release_scope.outputs.convex_sensitive }}
          DEFAULT_SHIP_RESULT: ${{ needs.default_ship.result }}
          RELEASE_BASE_SHA: ${{ needs.release_scope.outputs.base_sha }}
          RELEASE_COMMIT_SHA: ${{ needs.release_scope.outputs.head_sha }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const summary = {
            schemaVersion: "release-proof-summary.v1",
            workflowName: "Production Release Proof",
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            runUrl,
            commitSha: process.env.RELEASE_COMMIT_SHA,
            baseSha: process.env.RELEASE_BASE_SHA,
            environment: "production",
            proof: {
              billingSensitive: process.env.BILLING_SENSITIVE === "true",
              convexSensitive: process.env.CONVEX_SENSITIVE === "true",
              defaultShip: process.env.DEFAULT_SHIP_RESULT,
              billingIntegration: process.env.BILLING_RESULT,
            },
            generatedAt: new Date().toISOString(),
          };

          fs.writeFileSync("production-release-proof-summary.json", `${JSON.stringify(summary, null, 2)}\n`);
          NODE

      - name: Upload production release proof summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-release-proof-summary
          path: production-release-proof-summary.json
