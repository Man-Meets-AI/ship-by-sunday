name: Convex Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run `convex deploy --dry-run` instead of deploying
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: convex-production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Verify deploy key is configured
        run: |
          if [[ -z "$CONVEX_DEPLOY_KEY" ]]; then
            echo "CONVEX_DEPLOY_KEY is not configured." >&2
            exit 1
          fi

      - name: Choose deploy mode
        id: deploy_mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "label=dry-run" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "label=invalid-manual-deploy" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" && "${{ vars.CONVEX_PRODUCTION_DEPLOY_ENABLED }}" != "true" ]]; then
            echo "label=skip" >> "$GITHUB_OUTPUT"
          else
            echo "label=deploy" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Automatic deploys are paused
        if: steps.deploy_mode.outputs.label == 'skip'
        run: |
          echo "Skipping automatic Convex production deploy because CONVEX_PRODUCTION_DEPLOY_ENABLED is not set to true."
          echo "Run workflow_dispatch with dry_run=true on main first, then enable the repository variable when you are ready for automatic main deploys."

      - name: Manual production deploys must target main
        if: steps.deploy_mode.outputs.label == 'invalid-manual-deploy'
        run: |
          echo "workflow_dispatch with dry_run=false is only allowed from refs/heads/main." >&2
          exit 1

      - name: Run Convex production dry-run
        if: steps.deploy_mode.outputs.label == 'dry-run'
        working-directory: apps/web
        run: bunx convex deploy --dry-run -y

      - name: Deploy Convex production
        if: steps.deploy_mode.outputs.label == 'deploy'
        working-directory: apps/web
        run: bunx convex deploy -y

      - name: Write Convex production deploy summary
        if: always()
        env:
          DEPLOY_MODE: ${{ steps.deploy_mode.outputs.label }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const summary = {
            schemaVersion: "release-proof-summary.v1",
            workflowName: "Convex Production Deploy",
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            runUrl,
            commitSha: process.env.GITHUB_SHA,
            deployMode: process.env.DEPLOY_MODE,
            proof: {
              convex: process.env.DEPLOY_MODE === "deploy" ? "passed" : process.env.DEPLOY_MODE,
            },
            generatedAt: new Date().toISOString(),
          };

          fs.writeFileSync("convex-production-deploy-summary.json", `${JSON.stringify(summary, null, 2)}\n`);
          NODE

      - name: Upload Convex production deploy summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convex-production-deploy-summary
          path: convex-production-deploy-summary.json
