name: Convex Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - apps/web/convex/**
      - apps/web/package.json
      - bun.lock
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run a dry-run deploy instead of shipping production changes.
        required: false
        default: true
        type: boolean

jobs:
  convex-deploy:
    name: convex-deploy
    if: github.event_name == 'workflow_dispatch' || vars.CONVEX_PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Convex
        working-directory: apps/web
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            bunx convex deploy --dry-run -y
          else
            bunx convex deploy -y
          fi
