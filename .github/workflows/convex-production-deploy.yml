name: Convex Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run `convex deploy --dry-run` instead of deploying
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: convex-production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Verify deploy key is configured
        run: |
          if [[ -z "$CONVEX_DEPLOY_KEY" ]]; then
            echo "CONVEX_DEPLOY_KEY is not configured." >&2
            exit 1
          fi

      - name: Choose deploy mode
        id: deploy_mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "label=dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "label=deploy" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Convex production dry-run
        if: steps.deploy_mode.outputs.label == 'dry-run'
        working-directory: apps/web
        run: bunx convex deploy --dry-run -y

      - name: Deploy Convex production
        if: steps.deploy_mode.outputs.label == 'deploy'
        working-directory: apps/web
        run: bunx convex deploy -y
