name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_BASE_URL: https://example.com
      CLERK_FRONTEND_API_URL: https://clerk.example.com
      CLERK_SECRET_KEY: sk_test_dummy
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CONVEX_URL: https://smoke-test.convex.cloud
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Run unit tests
        run: bun run test:unit

      - name: Run contract tests
        run: bun run test:contracts

      - name: Build application
        run: bun run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run integration tests
        run: bun run test:integration

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Browser smoke retired
        run: echo "browser-smoke is a temporary branch-protection compatibility context; hosted proof runs after main through Production Release Proof."

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Helper CLI retired
        run: echo "cli is a temporary branch-protection compatibility context; active source checks are static and integration."
