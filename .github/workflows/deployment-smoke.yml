name: Deployment Smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Deployed URL to smoke test.
        required: true
        type: string

jobs:
  deployment-smoke:
    name: deployment-smoke
    if: |
      (github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        github.event.deployment_status.environment_url != '') ||
      (github.event_name == 'workflow_dispatch' && inputs.url != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bun run --cwd apps/web playwright:install

      - name: Smoke deployed URL
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.url || github.event.deployment_status.environment_url }}
          PLAYWRIGHT_USE_LOCAL_SERVER: "0"
          PLAYWRIGHT_CHECKOUT_SMOKE: "1"
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
