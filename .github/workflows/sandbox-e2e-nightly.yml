name: Sandbox E2E Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: sandbox-e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_RUN_SANDBOX: "1"
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
      E2E_NON_ENTITLED_EMAIL: ${{ secrets.E2E_NON_ENTITLED_EMAIL }}
      E2E_ENTITLED_EMAIL: ${{ secrets.E2E_ENTITLED_EMAIL }}
      E2E_SHARED_PASSWORD: ${{ secrets.E2E_SHARED_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bun run --cwd apps/web playwright:install

      - name: Run sandbox e2e tests
        run: bun run test:e2e:sandbox

      - name: Upload sandbox e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-e2e-nightly-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
