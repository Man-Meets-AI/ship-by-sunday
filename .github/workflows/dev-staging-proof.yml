name: Dev Staging Proof

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      force_billing:
        description: Force the billing integration gate even when there is no useful diff to inspect
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dev-staging-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release_scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.refs.outputs.base_sha }}
      billing_sensitive: ${{ steps.scope.outputs.billing_sensitive }}
      convex_sensitive: ${{ steps.scope.outputs.convex_sensitive }}
      head_sha: ${{ steps.refs.outputs.head_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0

      - name: Resolve release scope refs
        id: refs
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            head_sha="$(git rev-parse HEAD)"
            if git rev-parse "${head_sha}^" >/dev/null 2>&1; then
              base_sha="$(git rev-parse "${head_sha}^")"
            else
              base_sha="$head_sha"
            fi
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Detect release scope
        id: scope
        env:
          FORCE_BILLING: ${{ github.event_name == 'workflow_dispatch' && inputs.force_billing }}
          RELEASE_BASE_SHA: ${{ steps.refs.outputs.base_sha }}
          RELEASE_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        run: |
          if [[ "$FORCE_BILLING" == "true" ]]; then
            echo "billing_sensitive=true" >> "$GITHUB_OUTPUT"
            echo "convex_sensitive=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node qa/scripts/detect-release-scope.mjs --base="$RELEASE_BASE_SHA" --head="$RELEASE_HEAD_SHA"

  default_ship:
    needs: release_scope
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: dev-staging
    env:
      APP_BASE_URL: https://dev.man-meets-ai.com
      DEV_STAGING_QA_PERSONAS_LOCAL_JSON: ${{ secrets.DEV_STAGING_QA_PERSONAS_LOCAL_JSON }}
      DEV_STAGING_CONVEX_CONFIG_JSON: ${{ secrets.DEV_STAGING_CONVEX_CONFIG_JSON }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      PLAYWRIGHT_BASE_URL: https://dev.man-meets-ai.com
      QA_ENV_FILE: apps/web/.env.local
      RELEASE_COMMIT_SHA: ${{ needs.release_scope.outputs.head_sha }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bun run --cwd apps/web playwright:install

      - name: Wait for matching Vercel dev deployment
        run: |
          node qa/scripts/wait-for-vercel-production-deployment.mjs \
            --commit_sha="$RELEASE_COMMIT_SHA" \
            --target=preview \
            --alias_domain=dev.man-meets-ai.com \
            --assign_alias_if_missing=true

      - name: Wait for dev staging host
        run: node qa/scripts/wait-for-host.mjs --url="$PLAYWRIGHT_BASE_URL" --path=/ --path=/#pricing

      - name: Write QA persona credentials
        run: |
          if [[ -z "$DEV_STAGING_QA_PERSONAS_LOCAL_JSON" ]]; then
            echo "DEV_STAGING_QA_PERSONAS_LOCAL_JSON is not configured." >&2
            exit 1
          fi
          printf '%s\n' "$DEV_STAGING_QA_PERSONAS_LOCAL_JSON" > qa/personas.local.json

      - name: Pull staging app env from Vercel preview
        run: |
          cd apps/web
          bunx vercel env pull .env.local --environment preview --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_ID"
          python - <<'PY'
          from pathlib import Path

          env_path = Path(".env.local")
          lines = env_path.read_text().splitlines()
          filtered = [
              line
              for line in lines
              if not (
                  line.startswith("VERCEL")
                  or line.startswith("TURBO_")
                  or line.startswith("NX_DAEMON=")
              )
          ]
          env_path.write_text("\n".join(filtered) + "\n")
          PY

      - name: Write Convex CLI auth config
        run: |
          if [[ -z "$DEV_STAGING_CONVEX_CONFIG_JSON" ]]; then
            echo "DEV_STAGING_CONVEX_CONFIG_JSON is not configured." >&2
            exit 1
          fi
          mkdir -p "$HOME/.convex"
          printf '%s\n' "$DEV_STAGING_CONVEX_CONFIG_JSON" > "$HOME/.convex/config.json"

      - name: Sync hosted Convex dev when release touched Convex
        if: needs.release_scope.outputs.convex_sensitive == 'true'
        run: |
          cd apps/web
          bunx convex dev --once --typecheck disable

      - name: Run default ship pack on dev
        run: bun run qa:run-pack -- --pack=default_ship --slug=dev-staging-${{ github.run_id }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-staging-default-ship-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  billing_integration:
    if: needs.release_scope.outputs.billing_sensitive == 'true'
    needs:
      - release_scope
      - default_ship
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: dev-staging-billing-integration
    env:
      APP_BASE_URL: https://dev.man-meets-ai.com
      DEV_STAGING_QA_PERSONAS_LOCAL_JSON: ${{ secrets.DEV_STAGING_QA_PERSONAS_LOCAL_JSON }}
      DEV_STAGING_CONVEX_CONFIG_JSON: ${{ secrets.DEV_STAGING_CONVEX_CONFIG_JSON }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      PLAYWRIGHT_BASE_URL: https://dev.man-meets-ai.com
      QA_ENV_FILE: apps/web/.env.local
      QA_ALLOW_BILLING_INTEGRATION: "1"
      RELEASE_COMMIT_SHA: ${{ needs.release_scope.outputs.head_sha }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bun run --cwd apps/web playwright:install

      - name: Wait for matching Vercel dev deployment
        run: |
          node qa/scripts/wait-for-vercel-production-deployment.mjs \
            --commit_sha="$RELEASE_COMMIT_SHA" \
            --target=preview \
            --alias_domain=dev.man-meets-ai.com \
            --assign_alias_if_missing=true

      - name: Wait for dev staging host
        run: node qa/scripts/wait-for-host.mjs --url="$PLAYWRIGHT_BASE_URL" --path=/ --path=/#pricing

      - name: Write QA persona credentials
        run: |
          if [[ -z "$DEV_STAGING_QA_PERSONAS_LOCAL_JSON" ]]; then
            echo "DEV_STAGING_QA_PERSONAS_LOCAL_JSON is not configured." >&2
            exit 1
          fi
          printf '%s\n' "$DEV_STAGING_QA_PERSONAS_LOCAL_JSON" > qa/personas.local.json

      - name: Pull staging app env from Vercel preview
        run: |
          cd apps/web
          bunx vercel env pull .env.local --environment preview --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_ID"
          python - <<'PY'
          from pathlib import Path

          env_path = Path(".env.local")
          lines = env_path.read_text().splitlines()
          filtered = [
              line
              for line in lines
              if not (
                  line.startswith("VERCEL")
                  or line.startswith("TURBO_")
                  or line.startswith("NX_DAEMON=")
              )
          ]
          env_path.write_text("\n".join(filtered) + "\n")
          PY

      - name: Write Convex CLI auth config
        run: |
          if [[ -z "$DEV_STAGING_CONVEX_CONFIG_JSON" ]]; then
            echo "DEV_STAGING_CONVEX_CONFIG_JSON is not configured." >&2
            exit 1
          fi
          mkdir -p "$HOME/.convex"
          printf '%s\n' "$DEV_STAGING_CONVEX_CONFIG_JSON" > "$HOME/.convex/config.json"

      - name: Sync hosted Convex dev when release touched Convex
        if: needs.release_scope.outputs.convex_sensitive == 'true'
        run: |
          cd apps/web
          bunx convex dev --once --typecheck disable

      - name: Verify staging Stripe environment and checkout route
        run: |
          cd apps/web
          bun --env-file=.env.local scripts/verify-managed-stripe-env.ts \
            --expected-mode=test \
            --app-base-url=https://dev.man-meets-ai.com

      - name: Run billing integration gate on dev
        run: bun run qa:run-pack -- --pack=billing_integration --slug=dev-billing-${{ github.run_id }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-staging-billing-integration-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  release_gate:
    if: always()
    needs:
      - release_scope
      - default_ship
      - billing_integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce dev staging release gate
        env:
          BILLING_SENSITIVE: ${{ needs.release_scope.outputs.billing_sensitive }}
          BILLING_RESULT: ${{ needs.billing_integration.result }}
          DEFAULT_SHIP_RESULT: ${{ needs.default_ship.result }}
        run: |
          if [[ "$DEFAULT_SHIP_RESULT" != "success" ]]; then
            echo "default_ship must succeed for dev staging proof." >&2
            exit 1
          fi

          if [[ "$BILLING_SENSITIVE" == "true" && "$BILLING_RESULT" != "success" ]]; then
            echo "billing_integration was required and did not succeed." >&2
            exit 1
          fi

          echo "Dev staging release gate passed."
