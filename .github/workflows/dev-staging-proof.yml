name: Dev Staging Proof

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      billing_integration:
        description: Run the billing integration gate after the default ship pack
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dev-staging-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  default_ship:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: dev-staging
    env:
      APP_BASE_URL: https://dev.man-meets-ai.com
      CLERK_FRONTEND_API_URL: ${{ secrets.DEV_STAGING_CLERK_FRONTEND_API_URL }}
      CLERK_SECRET_KEY: ${{ secrets.DEV_STAGING_CLERK_SECRET_KEY }}
      DEV_STAGING_QA_PERSONAS_LOCAL_JSON: ${{ secrets.DEV_STAGING_QA_PERSONAS_LOCAL_JSON }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.DEV_STAGING_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.DEV_STAGING_NEXT_PUBLIC_CONVEX_SITE_URL }}
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.DEV_STAGING_NEXT_PUBLIC_CONVEX_URL }}
      PLAYWRIGHT_BASE_URL: https://dev.man-meets-ai.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bun run --cwd apps/web playwright:install

      - name: Write QA persona credentials
        run: |
          if [[ -z "$DEV_STAGING_QA_PERSONAS_LOCAL_JSON" ]]; then
            echo "DEV_STAGING_QA_PERSONAS_LOCAL_JSON is not configured." >&2
            exit 1
          fi
          printf '%s\n' "$DEV_STAGING_QA_PERSONAS_LOCAL_JSON" > qa/personas.local.json

      - name: Run default ship pack on dev
        run: bun run qa:run-pack -- --pack=default_ship --slug=dev-staging-${{ github.run_id }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-staging-default-ship-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  billing_integration:
    if: github.event_name == 'workflow_dispatch' && inputs.billing_integration
    needs: default_ship
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: dev-staging-billing-integration
    env:
      APP_BASE_URL: https://dev.man-meets-ai.com
      CLERK_FRONTEND_API_URL: ${{ secrets.DEV_STAGING_CLERK_FRONTEND_API_URL }}
      CLERK_SECRET_KEY: ${{ secrets.DEV_STAGING_CLERK_SECRET_KEY }}
      DEV_STAGING_QA_PERSONAS_LOCAL_JSON: ${{ secrets.DEV_STAGING_QA_PERSONAS_LOCAL_JSON }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.DEV_STAGING_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.DEV_STAGING_NEXT_PUBLIC_CONVEX_SITE_URL }}
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.DEV_STAGING_NEXT_PUBLIC_CONVEX_URL }}
      PLAYWRIGHT_BASE_URL: https://dev.man-meets-ai.com
      QA_ALLOW_BILLING_INTEGRATION: "1"
      STRIPE_SECRET_KEY: ${{ secrets.DEV_STAGING_STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.DEV_STAGING_STRIPE_WEBHOOK_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bun run --cwd apps/web playwright:install

      - name: Write QA persona credentials
        run: |
          if [[ -z "$DEV_STAGING_QA_PERSONAS_LOCAL_JSON" ]]; then
            echo "DEV_STAGING_QA_PERSONAS_LOCAL_JSON is not configured." >&2
            exit 1
          fi
          printf '%s\n' "$DEV_STAGING_QA_PERSONAS_LOCAL_JSON" > qa/personas.local.json

      - name: Run billing integration gate on dev
        run: bun run qa:run-pack -- --pack=billing_integration --slug=dev-billing-${{ github.run_id }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-staging-billing-integration-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
