name: Feature request
description: Propose a scoped improvement or new capability.
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this form for new capabilities or meaningful improvements to existing behavior.
        Small, concrete requests that clearly explain the problem and scope are much easier to evaluate.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I am describing a concrete problem or use case, not just a vague idea.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project would this change affect?
      options:
        - apps/web
        - apps/web/convex
        - Auth or entitlement
        - Billing or checkout
        - Release, CI, or deployment tooling
        - packages/*
        - Generated starter output
        - Docs or content
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do? What is hard, slow, or impossible today?
      placeholder: I want the app to preserve my progress through a workflow if I refresh the page or reconnect after a network interruption.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, API, or UX you want.
      placeholder: Persist enough client and backend state for the app to restore the current workflow on load.
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Why this matters
      description: Who benefits, and what outcome does this unlock?
      placeholder: This would make the product feel more reliable and reduce abandoned flows caused by accidental reloads.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Smallest useful scope
      description: What is the narrowest version of this request that would still solve your problem?
      placeholder: A first pass only needs to restore the active flow for the current browser session.
    validations:
      required: true

  - type: textarea
    id: release_sensitivity
    attributes:
      label: Release sensitivity
      description: If this touches auth, entitlement, checkout, billing, deploys, release metadata, or production proof, name that here.
      placeholder: This touches checkout success and should require billing-sensitive hosted proof before release.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, prior art, or other approaches you considered.
      placeholder: I currently work around this by restarting the flow manually, but that loses progress.

  - type: textarea
    id: tradeoffs
    attributes:
      label: Risks or tradeoffs
      description: What costs, complexity, or edge cases should be considered?
      placeholder: This may require careful handling when the underlying data changed while the user was away.

  - type: textarea
    id: references
    attributes:
      label: Examples or references
      description: Links, screenshots, mockups, or comparable tools.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be open to helping implement this.
